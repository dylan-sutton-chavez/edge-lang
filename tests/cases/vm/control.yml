- case: |-
    // an empty line reads as false while an empty dependency list stays a value
    lock = "[[package]]\nname = \"abi\"\nversion = \"0.9.6\"\n\n[[package]]\nname = \"itoa\"\nversion = \"1.0.18\"\nsource = \"registry+https://github.com/rust-lang/crates.io-index\"\n\n[[package]]\nname = \"lib\"\nversion = \"0.9.6\"\ndependencies = [\n \"edge\",\n \"itoa\",\n \"rig\",\n]\n"
    deps = {}
    name = nil
    blank = 0
    for _ in range(40) {
        for line in lock.split("\n") {
            if not line {
                blank += 1
                continue
            }
            if line.startswith("name = ") {
                name = line[8:-1]
                deps[name] = []
            } else if line.startswith(" \"") {
                deps[name].append(line[2:-2])
            }
        }
    }
    for name in ["abi", "itoa", "lib", "serde"] {
        found = deps.get(name)
        print(name, found or "not locked", len(found or []) or "no dependencies")
    }
    print(blank, bool(deps["abi"]), bool(""), bool(0), bool(float("nan")), [] and "kept")
  expected: |-
    abi [] no dependencies
    itoa [] no dependencies
    lib ["edge", "itoa", "rig"] 3
    serde not locked no dependencies
    120 true false false false kept
