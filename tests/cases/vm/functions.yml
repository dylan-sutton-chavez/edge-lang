    fn fannkuch(n) {
        perm1 = list(range(n))
        count = [0] * n
        maxf = 0
        check = 0
        r = n
        sign = 1
        while true {
            while r != 1 {
                count[r - 1] = r
                r -= 1
            }
            perm = perm1[:]
            flips = 0
            k = perm[0]
            while k {
                i = 0
                j = k
                while i < j {
                    perm[i], perm[j] = (perm[j], perm[i])
                    i += 1
                    j -= 1
                }
                flips += 1
                k = perm[0]
            }
            maxf = max(maxf, flips)
            check += flips * sign
            sign = -sign
            while true {
                if r == n {
                    return (check, maxf)
                }
                p0 = perm1[0]
                for i in range(r) {
                    perm1[i] = perm1[i + 1]
                }
                perm1[r] = p0
                count[r] -= 1
                if count[r] > 0 {
