    fn merge(a, b):
        result = []
        i = j = 0
        while i < len(a) && j < len(b):
            if a[i] <= b[j]:
                result.append(a[i])
                i += 1
            else:
                result.append(b[j])
                j += 1
        result.extend(a[i:])
        result.extend(b[j:])
        return result
    print(merge([1, 3, 5], [2, 4, 6]))
