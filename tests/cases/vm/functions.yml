- case: |-
    fn parse(s) {
        pos = [0]
        fn peek() {
            return if pos[0] < len(s) { s[pos[0]] } else { "" }
        }
        fn number() {
            start = pos[0]
            while peek().isdigit() {
                pos[0] += 1
            }
            return int(s[start:pos[0]])
        }
        fn factor() {
            if peek() == "(" {
                pos[0] += 1
                v = expr()
                pos[0] += 1
                return v
            }
            return number()
        }
        fn term() {
            v = factor()
            while peek() in ("*", "/") {
                op = peek()
                pos[0] += 1
                r = factor()
                v = if op == "*" { v * r } else { v ~/ r }
            }
            return v
        }
        fn expr() {
            v = term()
            while peek() in ("+", "-") {
                op = peek()
                pos[0] += 1
                r = term()
                v = if op == "+" { v + r } else { v - r }
            }
            return v
        }
        return expr()
    }
    exprs = ["(1+2)*3-4/2", "((7*8)-(6/3))+11*(2+3)", "100-(4*(3+2))/5", "2*(3+(4*(5+6)))"]
    t = 0
    for i in range(800) {
        t += parse(exprs[i % 4])
    }
    print(t)
