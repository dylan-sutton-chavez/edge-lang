    src = "x1 = (alpha + 42) * beta_2 - 7 / gamma; " * 500
    fn tokens(s):
        out = []
        i = 0
        n = len(s)
        while i < n:
            c = s[i]
            if c.isspace():
                i += 1
            else if c.isalpha() || c == "_":
                j = i
                while j < n && (s[j].isalnum() || s[j] == "_"):
                    j += 1
                out.append(("id", s[i:j]))
                i = j
            else if c.isdigit():
                j = i
                while j < n && s[j].isdigit():
                    j += 1
                out.append(("num", s[i:j]))
                i = j
            else:
                out.append(("op", c))
                i += 1
        return out
