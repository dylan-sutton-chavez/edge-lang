            c = min(xs, key=lambda x: len([y for y in xs if y == x]))
            d = max(ys, key=lambda x: len([y for y in xs if y != x]) + len([z for z in ys if z == x]))
            out.append(a[0] + b[0] + c + d)
        return out[-1], len(out)
    print(run(xs, ys))
