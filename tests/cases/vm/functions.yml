    fn binary_search(lst, target) {
        lo, hi = (0, len(lst) - 1)
        while lo <= hi {
            mid = (lo + hi) ~/ 2
            if lst[mid] == target {
                return mid
            } else if lst[mid] < target {
                lo = mid + 1
            } else {
                hi = mid - 1
            }
        }
        return -1
    }
