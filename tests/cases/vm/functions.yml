    fn solve(n):
        cols = set()
        d1 = set()
        d2 = set()
        count = 0
        fn place(r):
            nonlocal count
            if r == n:
                count += 1
                return
            for c in range(n):
                if c in cols || r + c in d1 || r - c in d2:
                    continue
                cols.add(c)
                d1.add(r + c)
                d2.add(r - c)
                place(r + 1)
                cols.discard(c)
                d1.discard(r + c)
                d2.discard(r - c)
        place(0)
        return count
