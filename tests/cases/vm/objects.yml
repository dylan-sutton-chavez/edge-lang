    class Sleep:
        def __init__(self, t):
            self.t = t
        def __await__(self):
            got = yield self.t
            return got
    def run(*coros):
        ready = [(0, i, c, None) for i, c in enumerate(coros)]
        results = {}
        while ready:
            ready.sort(key=lambda r: (r[0], r[1]))
            when, i, c, val = ready.pop(0)
            try:
                t = c.send(val)
            except StopIteration as e:
                results[i] = e.value
                continue
            ready.append((when + t, i, c, when + t))
        return [results[i] for i in sorted(results)]
    async def worker(name, n, step):
        total = 0
        for k in range(n):
            woke = await Sleep(step)
            print(name, k, woke)
            total += woke
        return name, total
    async def nested(depth):
        if depth == 0:
            return await Sleep(1)
        return 1 + await nested(depth - 1)
    print(run(worker('a', 3, 2), worker('b', 2, 3), nested(5)))
