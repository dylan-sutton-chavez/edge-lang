        def __radd__(self, o):
            print('radd', o)
            return N(o + self.v)
    def g():
        for i in range(3):
            print('yield', i)
            yield N(i)
    print(sum(g()).v)
  expected: |-
    yield 0
    radd 0
    yield 1
    add 0
    yield 2
    add 1
    3

- case: |-
    class N:
        def __init__(self, v):
            self.v = v
        def __add__(self, o):
            return N(self.v + (o.v if isinstance(o, N) else o))
        def __radd__(self, o):
            return N(o + self.v)
        def __lt__(self, o):
            return self.v < o.v
    def g(n):
        for i in range(n):
            junk = [list(range(40)) for _ in range(6)]
            yield N(i % 97)
    print(sum(g(3000)).v, min(g(3000)).v, max(g(3000)).v)
  expected: |-
    143685 0 96

