    class C:
        def __init__(self, n):
            self.n = n
        def items(self):
            for i in range(self.n):
                yield self.n - i
    c = C(5)
    t = 0
    for v in c.items():
        t = t * 10 + v
    print(t)
  expected: |-
    54321

