    class N:
        def __init__(self, k):
            self.k = k
            self.l = None
            self.r = None
    def insert(root, k):
        if root is None:
            return N(k)
        cur = root
        while True:
            if k < cur.k:
                if cur.l is None:
                    cur.l = N(k)
                    return root
                cur = cur.l
            else:
                if cur.r is None:
                    cur.r = N(k)
                    return root
                cur = cur.r
    def has(root, k):
        while root is not None:
            if k == root.k:
                return True
            root = root.l if k < root.k else root.r
        return False
    root = None
    for i in range(4000):
        root = insert(root, (i * 7919) % 10007)
    print(sum([1 for i in range(0, 10007, 3) if has(root, i)]))
