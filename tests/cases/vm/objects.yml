- case: |-
    t = time("2026-10-01T15:04:05Z")
    n = 0
    for i in range(300) {
        n += t.year + t.month + t.day + t.hour + t.minute + t.second
    }
    print(n)
  expected: |-
    618300

- case: |-
    t = time("2026-10-01T15:04:05Z")
    n = 0
    for i in range(3) {
        n += t.year
    }
    print(t.nope)
  error: "FieldError: time has no field nope"

- case: |-
    // bound natives a collection frees leave no entry behind and held ones still call
    n = 0
    for i in range(6000) {
        s = text(i)
        if s.endswith(("7", "9")) {
            n += 1
        }
    }
    words = ["ab", "cd"]
    ups = [w.upper for w in words]
    for i in range(6000) {
        s = text(i)
        if s.endswith(("1", "3")) {
            n += 1
        }
    }
    print(n, [f() for f in ups])
  expected: |-
    2400 ["AB", "CD"]

- case: |-
    // a store to a field a value's kind reads is refused as read only
    t = time("2026-10-01T15:04:05Z")
    try {
        t.year = 5
    } catch FieldError as x {
        print("AttributeError", x)
    }
    print(t.year)
  expected: |-
    AttributeError the field year of time is read only
    2026
