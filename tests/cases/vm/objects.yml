    class EventBus:
        def __init__(self):
            self.handlers = {}
        def on(self, event, fn):
            if event not in self.handlers:
                self.handlers[event] = []
            self.handlers[event].append(fn)
        def emit(self, event, data):
            for fn in self.handlers.get(event, []):
                fn(data)
    log = []
    bus = EventBus()
    bus.on('click', lambda d: log.append(d))
    bus.emit('click', 1)
    bus.emit('click', 2)
    print(log)
  expected: |-
    [1, 2]

