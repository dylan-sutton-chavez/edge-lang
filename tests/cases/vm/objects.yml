            self.ident = ident
            self.prio = prio
            self.count = 0
        fn run(self, packet):
            self.count += 1
            return packet + self.prio
    class Worker(Task):
        fn run(self, packet):
            self.count += 1
            return (packet * 3 + self.ident) % 9973
    class Handler(Task):
        fn run(self, packet):
            self.count += 2
            return packet ^ self.ident
    class Scheduler:
        fn __init__(self, tasks):
            self.tasks = tasks
        fn schedule(self, rounds):
            packet = 1
            for r in range(rounds):
                t = self.tasks[r % len(self.tasks)]
                packet = t.run(packet) % 100003
            return packet
    tasks = [Task(1, 3), Worker(2, 1), Handler(3, 5), Worker(4, 2), Handler(5, 7), Task(6, 1)]
    s = Scheduler(tasks)
    print(s.schedule(150000), [t.count for t in tasks])
