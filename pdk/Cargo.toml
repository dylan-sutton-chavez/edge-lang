[package]
name = "wasm-pdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Edge Python Plugin Development Kit, author-side runtime for writing plugin modules importable from Edge Python scripts, compiled to `.wasm` for the JS host and the CLI. Provides `#[plugin_fn]` proc-macro, Handle/Value/Error types, and From/IntoValue traits over the v1 plugin ABI."

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
wasm-abi = { workspace = true }
wasm-pdk-macros = { path = "macros" }
# The free-list allocator backs `module_fixed_pool!()`, a static pool that never calls `memory.grow`.
linked_list_allocator = { version = "0.10", default-features = false }

# Re-exported so `wasm_pdk::module!()` can name the symbol, authors with their own allocator pay nothing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = { workspace = true }
