- native: print
  args: [1.5, !tuple [1, 2]]
  out: "1.5 (1, 2)"

- native: print
  args: ["a", null, true]
  out: "a None True"

- native: print
  args: [1, 2]
  kw: {sep: "-"}
  out: "1-2"

- native: print
  args: ["x"]
  kw: {end: ""}
  out: "x"

- native: print
  args: [{"k": [1, "v"]}]
  out: "{'k': [1, 'v']}"

- native: print
  args: [true]
  out: "True"

- native: print
  args: [false]
  out: "False"

- native: print
  args: [null]
  out: "None"

- native: print
  args: ["hello"]
  out: "hello"

- native: print
  args: [!bytes "68656c6c6f"]
  out: "b'hello'"

- native: print
  args: [!bytes ""]
  out: "b''"

- native: print
  args: [!bytes "610a620963"]
