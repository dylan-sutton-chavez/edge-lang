- native: record
  args: [[["a", 1], ["b", 2]]]
  ret: {"a": 1, "b": 2}

- native: record.get
  recv: {"a": 1}
  args: ["b", 0]
  ret: 0

- native: record.pop
  recv: {"a": 1}
  args: ["z", 0]
  ret: 0

- native: record.fromkeys
  args: [["a", "b"], 0]
  ret: {"a": 0, "b": 0}

- native: record.setdefault
  recv: {}
  args: ["k", 5]
  ret: 5

- native: record.popitem
  recv: {"a": 1, "b": 2}
  ret: !tuple ["b", 2]

- native: record
  args: [0]
  error: "TypeError"

- native: record
  args: [[!tuple [1, 2], !tuple [3, 4]]]
  prints: "{1 = 2, 3 = 4}"

- native: record
  args: [[!tuple ["a", 1], !tuple ["b", 2]]]
  prints: "{a = 1, b = 2}"

- native: record
  args: [{"a": 1, "b": 2}]
  prints: "{a = 1, b = 2}"

- native: record
  kw: {a: 1, b: 2}
  prints: "{a = 1, b = 2}"

- native: record
  args: [1, 2]
  error: "TypeError: record() takes 0 to 1 arguments, not 2"

- native: record
  args: [-1]
  error: "TypeError"

- native: record.fromkeys
  args: [["a", "b"], 0]
  prints: "{a = 0, b = 0}"

- native: record
  prints: "{}"

- native: record.clear
  recv: {"a": 1}
  prints: "nil"

- native: record.get
  recv: {}
  error: "TypeError: record.get() takes 1 to 2 arguments, not 0"

- native: record.setdefault
  recv: {1: 2}
  args: [{}]
  error: "TypeError: a value of kind record cannot stand as a key"
