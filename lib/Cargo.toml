[package]
name = "interpreter-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kernels a runtime built on interpreter names in its own tables, for text, numbers, sequences, maps, sets, dates, JSON, CSV and I/O, each behind a feature."
documentation = "https://docs.rs/interpreter-lib"
readme = "../README.md"
keywords = ["interpreter", "runtime", "stdlib", "wasm"]
categories = ["compilers", "wasm", "no-std"]
include = ["/src/**/*.rs"]

[lib]
name = "interpreter_lib"
doctest = false

# a runtime picks its modules and each pulls in the modules whose helpers it calls
[features]
default = ["all"]
all = ["bytes", "data", "date", "io", "iter", "map", "num", "reflect", "seq", "set", "spec", "text", "types"]
bytes = ["iter", "num"]
data = ["iter", "map"]
date = []
io = []
iter = []
map = ["iter"]
num = ["iter"]
reflect = []
seq = ["iter", "num"]
set = ["iter"]
spec = ["num"]
text = ["bytes", "iter", "num"]
types = []

[dependencies]
interpreter = { workspace = true }
itoa = { workspace = true }

# host tests run threaded on std and write their programs for the test rig
[dev-dependencies]
rig = { path = "../tests/rig" }
interpreter = { path = "..", features = ["std"] }
# the native cases are yml files the runner reads
serde_yaml_ng = { workspace = true }
