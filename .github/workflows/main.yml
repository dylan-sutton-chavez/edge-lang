name: CI

# Builds stage their part of the CDN tree as artifacts, tests serve it on loopback, and a tag ships the tested tree with its release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  EDGE_CDN_BASE: http://127.0.0.1:8788

jobs:
  wasm:
    name: Wasm
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/wasm
        with:
          github-token: ${{ github.token }}

  js:
    name: JS
    needs: [wasm]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/js

  # cli/build.rs embeds the speed edge.wasm the wasm job staged
  cli:
    name: CLI / ${{ matrix.entry }}
    needs: [js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: lint
            mode: lint
            runner: ubuntu-26.04
          - entry: x86_64-unknown-linux-musl
            mode: release
            target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - entry: aarch64-unknown-linux-musl
            mode: release
            target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - entry: aarch64-apple-darwin
            mode: release
            target: aarch64-apple-darwin
            runner: macos-15
          - entry: x86_64-apple-darwin
            mode: release
            target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cli
        with:
          mode: ${{ matrix.mode }}
          target: ${{ matrix.target }}

  # Every suite runs against the tree this run staged, served on loopback, never the deployed one.
  test:
    name: Test / ${{ matrix.entry }}
    needs: [cli]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: js
            suite: js
          - entry: cli-engine
            cli: engine
          - entry: cli-network
            cli: network
          - entry: cli-actors
            cli: actors
          - entry: cli-consistency
            cli: consistency
          - entry: cli-skill
            cli: skill
          - entry: cli-uptime
            cli: uptime
          - entry: cli-tiny
            cli: tiny
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/serve
      - if: matrix.suite
        uses: ./.github/actions/test
      - if: matrix.cli
        uses: ./.github/actions/cli
        with:
          mode: test
          suite: ${{ matrix.cli }}

  # Holds the engine to the instructions of bench/.snapshot once its tests pass.
  bench:
    name: Bench
    needs: [wasm]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bench

  # Pushes only, the tested parts merged into the one tree a deploy takes, and a tag attaches it to its release.
  tree:
    name: Tree
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Merge the parts
        uses: actions/download-artifact@v8
        with:
          pattern: cdn-*
          merge-multiple: true
          path: _cdn

      - name: Keep the tree
        uses: actions/upload-artifact@v7
        with:
          name: cdn
          path: _cdn
          if-no-files-found: error

      - name: Pack for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -C _cdn -czf cdn.tar.gz .

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: cdn.tar.gz
          fail_on_unmatched_files: true
