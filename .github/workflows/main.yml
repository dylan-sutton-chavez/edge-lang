name: CI

# builds stage their part of the CDN tree as artifacts, tests serve it on loopback, and a tag ships the tested tree with its release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  INTERPRETER_CDN_BASE: http://127.0.0.1:8788

jobs:
  wasm:
    name: Wasm
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/wasm
        with:
          github-token: ${{ github.token }}

  js:
    name: JS
    needs: [wasm]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/js

  cli:
    name: CLI / ${{ matrix.entry }}
    needs: [js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: lint
            mode: lint
            runner: ubuntu-26.04
          - entry: x86_64-unknown-linux-musl
            mode: release
            target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - entry: aarch64-unknown-linux-musl
            mode: release
            target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - entry: aarch64-apple-darwin
            mode: release
            target: aarch64-apple-darwin
            runner: macos-15
          - entry: x86_64-apple-darwin
            mode: release
            target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cli
        with:
          mode: ${{ matrix.mode }}
          target: ${{ matrix.target }}

  # every suite runs against the tree this run staged, served on loopback, never the deployed one
  test:
    name: Test / ${{ matrix.entry }}
    needs: [cli]
    runs-on: ${{ matrix.runner || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: js
            suite: js
          - entry: cli-engine
            cli: engine
          - entry: cli-network
            cli: network
          - entry: cli-actors
            cli: actors
          - entry: cli-consistency
            cli: consistency
          - entry: cli-docs
            cli: docs
          # the native runtime loads as a .dylib here which no Linux run reaches
          - entry: cli-native-macos
            cli: native
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/serve
      - if: matrix.suite
        uses: ./.github/actions/test
      - if: matrix.cli
        uses: ./.github/actions/cli
        with:
          mode: test
          suite: ${{ matrix.cli }}

  # holds the engine to the instructions of bench/.snapshot once its tests pass
  bench:
    name: Bench
    needs: [wasm]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bench

  # holds every public item to tests/api.txt and tests/api-wasm.txt on the nightly the Makefile pins
  api:
    name: API
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # the pin lives in the Makefile alone so a bump edits one line
      - name: Toolchain (api nightly)
        run: rustup toolchain install "$(sed -n 's/^API_NIGHTLY := //p' Makefile)" --profile minimal --target wasm32-unknown-unknown

      # no prebuilt manifest of its own so install-action takes it through cargo-binstall
      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0

      # the cli feature embeds the js host which make api builds first
      - name: Deno
        uses: ./.github/actions/deno

      - name: API
        run: make api

  # pushes only, the tested parts merged into the one tree a deploy takes, and a tag attaches it to its release
  tree:
    name: Tree
    needs: [test, bench, api]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Merge the parts
        uses: actions/download-artifact@v8
        with:
          pattern: cdn-*
          merge-multiple: true
          path: _cdn

      - name: Keep the tree
        uses: actions/upload-artifact@v7
        with:
          name: cdn
          path: _cdn
          if-no-files-found: error

      - name: Pack for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -C _cdn -czf cdn.tar.gz .

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: cdn.tar.gz
          fail_on_unmatched_files: true

  # a tag alone puts the crate on crates.io once its tree is whole and every other run skips this job
  publish:
    name: Publish
    needs: [tree]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      # the cli feature embeds the js host so the api check and the package both need js/dist
      - name: Deno
        uses: ./.github/actions/deno

      - name: JS host
        run: make js

      # a tag ships only the version the crate already carries
      - name: The tag is the version
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "interpreter") | .version')" = "$GITHUB_REF_NAME"

      # a name with no release on crates.io yet has nothing to check against
      - name: Baseline
        id: baseline
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://index.crates.io/in/te/interpreter)
          case "$code" in
            200) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "found=false" >> "$GITHUB_OUTPUT"; echo "no release of interpreter on crates.io so the semver checks skip" ;;
            *) echo "the crates.io index answered $code"; exit 1 ;;
          esac

      # a version that breaks the api of the last release without a new major never ships
      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.found == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0

      # every feature but the unstable ones on the host
      - name: The version holds to the API
        if: steps.baseline.outputs.found == 'true'
        run: cargo semver-checks -p interpreter

      # wasm32 apart since its impls differ and cap-lints allow hides its crate types
      - name: The version holds to the API on wasm32
        if: steps.baseline.outputs.found == 'true'
        env:
          RUSTFLAGS: --cap-lints=warn
        run: cargo semver-checks -p interpreter --target wasm32-unknown-unknown --only-explicit-features --features full,plugin,exports

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # the js host make js built is the one change the tree may hold
        run: |
          test -z "$(git status --porcelain -- . ':!js/dist')"
          cargo publish -p interpreter --locked --allow-dirty
