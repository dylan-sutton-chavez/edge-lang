name: Miri

on:
  schedule:
    - cron: "0 */6 * * *" # every six hours
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A late block waits instead of cancelling the running one.
concurrency:
  group: miri
  cancel-in-progress: false

jobs:
  miri:
    name: Miri / ${{ matrix.worker }}
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four workers for cases under an hour, one for the longer ones.
          - { worker: w1, long: false }
          - { worker: w2, long: false }
          - { worker: w3, long: false }
          - { worker: w4, long: false }
          - { worker: long, long: true }
    steps:
      # The deadline counts from the job's start.
      - name: Start
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      # Miri ships on nightly only, and it stays in this workflow so the rest of CI keeps to stable.
      - name: Toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Building the sysroot is its own step, so its minutes never read as interpreting time.
      - name: Sysroot
        run: make miri-setup

      - name: Interpret
        env:
          WORKER: ${{ matrix.worker }}
          LONG: ${{ matrix.long }}
        run: bash make/miri.sh
