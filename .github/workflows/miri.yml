name: Miri

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours
  workflow_dispatch:

permissions:
  contents: read
  # Each run starts the next one, so the blocks follow each other however late the schedule is.
  actions: write

# A late run waits instead of cancelling the running one.
concurrency:
  group: miri
  cancel-in-progress: false

jobs:
  miri:
    name: Miri / ${{ matrix.suite }}
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        suite: [vm, snapshot, modules, parser, lexer, abi]
    steps:
      # The deadline counts from the job's start.
      - name: Start
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # The table of what the last runs of this suite interpreted, so this one picks up where they stopped.
      - name: Restore table
        uses: actions/cache/restore@v6
        with:
          path: miri
          key: miri-table-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: miri-table-${{ matrix.suite }}-

      # Every suite builds the same tests, and the Makefile pins the nightly, so a bump starts a fresh cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
          key: ${{ hashFiles('Makefile') }}

      # Miri ships on nightly only, so the Makefile pins one for this workflow alone, set up in a step of its own so its minutes never read as interpreting time.
      - name: Toolchain and sysroot
        run: make miri-setup

      - name: Interpret
        env:
          SUITE: ${{ matrix.suite }}
        run: bash make/miri.sh

      - name: Save table
        if: always()
        uses: actions/cache/save@v6
        with:
          path: miri
          key: miri-table-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The next run once every suite of this one passes, which waits for it. A failed test runs again first, so a red run starts none and the schedule retries it.
  next:
    needs: miri
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run miri.yml --ref main -R ${{ github.repository }}
