name: Fuzz

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours
  workflow_dispatch:

permissions:
  contents: read
  # Each run starts the next one, so the blocks follow each other however late the schedule is.
  actions: write

# A late block waits instead of cancelling the running one.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: American Fuzzy Lop (fuzzer)
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    env:
      AFL_NO_AFFINITY: "1"
      # The restored corpus loads faster and skips the cmplog it already had.
      AFL_FAST_CAL: "1"
      AFL_CMPLOG_ONLY_NEW: "1"
    steps:
      # AFL stops 40 minutes before the job's 355, and each later step has a timeout of its own, so the job never reaches its timeout.
      - name: Start
        run: echo "UNTIL=$(( $(date +%s) + (355 - 40) * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      # No cargo cache on purpose (a restored ~/.cargo corrupts cargo-afl's state); install also builds the AFL LLVM runtime, so don't rebuild it.
      - name: Install cargo-afl
        run: cargo install cargo-afl

      # The newest corpus a block saved.
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      - name: Strategy
        run: bash fuzz/strategy.sh | tee -a "$GITHUB_ENV"

      # A step timeout fails the step and the steps below still run, where the job timeout would cancel them.
      - name: Fuzz
        timeout-minutes: 318
        run: make fuzz

      # The runner kills only the step's shell, so an AFL it left behind is stopped here.
      - name: Stop AFL
        if: always()
        timeout-minutes: 1
        run: |
          pkill -INT -x afl-fuzz && sleep 20
          pkill -KILL -x afl-fuzz || true

      - name: Carry corpus
        if: always()
        timeout-minutes: 13
        run: make fuzz-carry

      - name: Save corpus
        if: always()
        timeout-minutes: 5
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Triage
        if: always()
        timeout-minutes: 3
        working-directory: fuzz
        run: |
          shopt -s nullglob
          crashes=(out/*/crashes*/id:*)
          hangs=(out/*/hangs*/id:*)
          for f in "${hangs[@]}"; do echo "::warning::hang $(basename "$f")"; done
          if (( ${#crashes[@]} )); then
            for f in "${crashes[@]}"; do echo "::error::crash $f"; cat "$f"; echo; done
            exit 1
          fi
          echo "no crashes (${#hangs[@]} hangs)"

      # AFL findings use colons in names (rejected by upload-artifact), so tar them; create an empty archive if out/ doesn't exist yet.
      - name: Package findings
        if: always()
        timeout-minutes: 2
        run: |
          shopt -s nullglob
          dirs=(fuzz/out/*/crashes* fuzz/out/*/hangs*)
          if (( ${#dirs[@]} )); then
            tar -czf findings.tar.gz "${dirs[@]}"
          else
            echo "no findings to package"
            tar -czf findings.tar.gz --files-from /dev/null
          fi

      - name: Upload findings
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: findings.tar.gz
          retention-days: 14

      # The next block, which waits for this one to end. A cancelled run starts none, and the schedule picks the chain up again.
      - name: Next
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fuzzer.yml --ref main -R ${{ github.repository }}
