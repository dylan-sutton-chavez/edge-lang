name: Wasm
description: The edge crate and edge.wasm. Shear and clippy, wasm build and optimize, tests, staging, tag release.

inputs:
  github-token:
    description: Token for the tag Release upload (tags only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    # A tag names the release the CLI reports, so the earliest job refuses one the manifests disagree with.
    - name: Check the version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: make version TAG=${{ github.ref_name }}

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    # The release, its wasm target and clippy all come from rust-toolchain.toml, so a bump edits that file alone.
    - name: Toolchain (pinned)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rustflags: ""

    # rust-cache drops binaries installed during the job, so take the prebuilt one.
    - name: Install cargo-shear
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-shear@1.13.4

    - name: Lint
      shell: bash
      run: make lint-rust

    # build-std needs nightly plus rust-src.
    - name: Toolchain (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: wasm32-unknown-unknown
        components: rust-src

    # apt ships an old binaryen, so fetch the upstream release.
    - name: Install wasm-opt
      shell: bash
      run: |
        curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz \
          | tar -xz --strip-components=2 -C /usr/local/bin binaryen-version_121/bin/wasm-opt
        wasm-opt --version

    - name: Build
      shell: bash
      run: make wasm-ship

    # A notice survives on the run page, a job summary would be buried among the other jobs.
    - name: Size
      shell: bash
      run: echo "::notice title=edge.wasm::served as $(make -s size)"

    - name: Test
      shell: bash
      run: make test

    # edge.wasm ships with its compiler.wasm copy and the speed build goes under _build/
    - name: Stage
      uses: ./.github/actions/stage
      with:
        part: wasm
        name: cdn-wasm

    - name: Upload WASM Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ inputs.github-token }}
        files: target/wasm32-unknown-unknown/release/edge.wasm
        fail_on_unmatched_files: true
        generate_release_notes: true
