name: Test
description: The Deno and Chromium suites of the JS host, against the CDN tree this run staged.

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    # A 150MB Chromium, cached so only the first run pays the download.
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium

    - name: Install Chromium
      shell: bash
      run: make browsers

    # the Deno suite loads the plugin example to prove it reaches and awaits system calls
    - name: Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rustflags: ""

    # Every JS host suite, the Deno ones with no browser and the Playwright ones in Chromium.
    - name: JS host
      shell: bash
      run: make test-js
