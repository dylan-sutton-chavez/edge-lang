name: Test
description: The Deno and Chromium suites of the JS host, against the CDN tree this run staged.

runs:
  using: composite
  steps:
    - name: Deno
      uses: ./.github/actions/deno

    # a 150MB Chromium, cached so only the first run pays the download
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium

    - name: Install Chromium
      shell: bash
      run: make browsers

    # the Deno suite loads the plugin example to prove it reaches and awaits system calls
    - name: Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rustflags: ""

    # every JS host suite, the Deno ones with no browser and the Playwright ones in Chromium
    - name: JS host
      shell: bash
      run: make test-js
