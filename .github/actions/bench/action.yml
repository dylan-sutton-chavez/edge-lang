name: Bench
description: Counts the instructions edge.wasm runs for every case of tests/cases/vm and holds them to bench/.snapshot.

runs:
  using: composite
  steps:
    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Toolchain (pinned)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rustflags: ""

    # the bench counts the build before wasm-opt and never the one the wasm job stages
    - name: Bench
      shell: bash
      run: make bench

    # a build with its static data shifted must count every case alike
    - name: Layout
      shell: bash
      run: make bench-layout
