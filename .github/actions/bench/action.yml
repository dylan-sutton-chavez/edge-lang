name: Bench
description: Counts the instructions compiler.wasm runs for every vm.json case and holds them to bench/.snapshot.

runs:
  using: composite
  steps:
    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Toolchain (pinned)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rustflags: ""

    # Runs on the build the snapshot was taken from, never the wasm-opt one the Compiler job stages.
    - name: Bench
      shell: bash
      run: make bench
