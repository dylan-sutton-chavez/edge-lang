name: CLI
description: "The interpreter binary and interpreter::cli behind the cli features of the crate, with lint as clippy and check, release as a build staged per target and test as cargo test."

inputs:
  mode:
    description: "lint | release | test"
    required: true
  target:
    description: Rust target triple (release mode).
    required: false
    default: ""
  suite:
    description: "engine | network | actors | consistency | docs | native (test mode)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # the host is TypeScript and strips in seconds, so make builds it here rather than fetching it
    - name: Deno
      uses: ./.github/actions/deno

    - name: Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ inputs.mode == 'test' && 'wasm32-unknown-unknown' || inputs.target }}
        cache: false
        rustflags: ""

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        # lint and every test suite build the same debug CLI so they share one cache
        shared-key: ${{ inputs.mode != 'release' && 'cli-debug' || '' }}
        key: ${{ inputs.target }}

    - name: Clippy and check
      if: inputs.mode == 'lint'
      shell: bash
      run: make lint-cli

    - name: Build release
      if: inputs.mode == 'release'
      shell: bash
      run: make cli-release TARGET=${{ inputs.target }}

    # the tarball and the install scripts land under cli/
    - name: Stage
      if: inputs.mode == 'release'
      uses: ./.github/actions/stage
      with:
        part: cli
        name: cdn-cli-${{ inputs.target }}

    # web and net suites use the js suite's cached chromium since apt ships a snap
    - name: Cache Playwright browsers
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == 'network' || inputs.suite == '')
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium

    - name: Install Chromium
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == 'network' || inputs.suite == '')
      shell: bash
      run: |
        make browsers
        chrome=$(find ~/.cache/ms-playwright -path '*/chromium-*/chrome-linux*/chrome' -type f | head -1)
        test -x "$chrome"
        echo "INTERPRETER_CHROME_PATH=$chrome" >> "$GITHUB_ENV"

    - name: Test
      if: inputs.mode == 'test'
      shell: bash
      run: make test-cli SUITE=${{ inputs.suite }}
