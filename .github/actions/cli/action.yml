name: CLI
description: cli/ is its own workspace. lint is clippy and check, release builds and stages per target, test runs cargo test.

inputs:
  mode:
    description: "lint | release | test"
    required: true
  target:
    description: Rust target triple (release mode).
    required: false
    default: ""
  suite:
    description: "engine | network | actors | consistency | skill | uptime | tiny (test mode)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # cli/build.rs embeds the speed edge.wasm the wasm job staged, which the use case CLIs never do
    - name: Fetch the build inputs
      if: inputs.suite != 'uptime' && inputs.suite != 'tiny'
      uses: actions/download-artifact@v8
      with:
        name: cdn-wasm
        path: _inputs

    - name: Point the build at them
      if: inputs.suite != 'uptime' && inputs.suite != 'tiny'
      shell: bash
      run: echo "EDGE_WASM=$GITHUB_WORKSPACE/_inputs/_build/edge-cli.wasm" >> "$GITHUB_ENV"

    # The host is TypeScript and strips in seconds, so make builds it here rather than fetching it.
    - name: Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ inputs.mode == 'test' && 'wasm32-unknown-unknown' || inputs.target }}
        cache: false
        rustflags: ""

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> target
        # lint and every test suite build the same debug CLI so they share one cache
        shared-key: ${{ inputs.mode != 'release' && 'cli-debug' || '' }}
        key: ${{ inputs.target }}

    - name: Clippy and check
      if: inputs.mode == 'lint'
      shell: bash
      run: make lint-cli

    - name: Build release
      if: inputs.mode == 'release'
      shell: bash
      run: make cli-release TARGET=${{ inputs.target }}

    # The tarball and the install scripts land under cli/.
    - name: Stage
      if: inputs.mode == 'release'
      uses: ./.github/actions/stage
      with:
        part: cli
        name: cdn-cli-${{ inputs.target }}

    # the web and net suites drive a real browser that the runner image may lack
    - name: Install Chromium
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == 'network' || inputs.suite == '')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

    - name: Test
      if: inputs.mode == 'test' && inputs.suite != 'uptime' && inputs.suite != 'tiny'
      shell: bash
      run: make test-cli SUITE=${{ inputs.suite }}

    # a composition of its own over its own runtime, so it builds none of the edge assets
    - name: Test the use case CLI
      if: inputs.mode == 'test' && (inputs.suite == 'uptime' || inputs.suite == 'tiny')
      shell: bash
      run: make ${{ inputs.suite == 'tiny' && 'test-tiny-cli' || 'test-uptime' }}
