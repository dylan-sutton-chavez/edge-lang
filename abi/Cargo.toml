[package]
name = "interpreter-abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire-format constants of the plugin ABI shared by the interpreter engine and its plugin kit, no_std with no dependencies."
documentation = "https://docs.rs/interpreter-abi"
readme = "../README.md"
keywords = ["interpreter", "abi", "plugin", "wasm"]
categories = ["wasm", "no-std", "encoding"]
include = ["/src/**/*.rs"]

[lib]
crate-type = ["rlib"]
doctest = false
test = false
