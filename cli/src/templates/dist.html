<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>edge app</title>
</head>
<body>
  <script type="module">
    // the worker runs the program beside this page under the imports and grants of edge.json
    import { createWorker } from "./js/src/index.js";
    const src = await fetch("./__EDGE_ENTRY__").then((r) => r.text());
    const worker = await createWorker({ baseUrl: location.href });
    // output arrives in chunks so only whole lines reach `console.log` which adds its own newline
    let buf = "";
    worker.onOutput((chunk) => {
      buf += chunk;
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) { console.log(buf.slice(0, nl)); buf = buf.slice(nl + 1); }
    });
    await worker.run(src, { entry: "__EDGE_ENTRY__" });
    if (buf) console.log(buf);
  </script>
</body>
</html>
