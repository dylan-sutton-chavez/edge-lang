<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <script type="module">
    import { createWorker } from "/js/src/index.js";
    // the progress the CLI reads over CDP as output grows until done flips
    const st = { out: "", done: false, ok: false, code: 0, err: "" };
    window.__edge = st;
    try {
      const { src, entry, limits } = __EDGE_RUN__;
      // the page reads the project edge.json from this server with its imports already locked
      const worker = await createWorker({ baseUrl: `${location.origin}/`, limits });
      worker.onOutput((text) => { st.out += text });
      const res = await worker.run(src, { entry });
      st.code = res && res.exitCode ? res.exitCode : 0;
      if (res && res.out) st.err = res.out;
      else st.ok = true;
    } catch (e) {
      st.err = e && e.message ? e.message : String(e);
    } finally {
      st.done = true;
    }
  </script>
</body>
</html>
