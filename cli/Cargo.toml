# An empty table makes this crate its own workspace root, apart from the compiler workspace.
[workspace]

[package]
name = "edge"
version = "0.9.6"
edition = "2024"
description = "The Edge Python developer CLI. Runs, tests, and scaffolds scripts on the same compiler.wasm the browser uses, hosted under wasmtime, packs apps into standalone binaries or bundles, and runs cooperative actor pools."

[[bin]]
name = "edge"
path = "src/main.rs"

[dependencies]
# The engine crate as a library, manifest parsing and sha256 pinning.
edge-python = { path = ".." }
# Runs the precompiled compiler.wasm, Cranelift compiles the third party plugins a project declares.
wasmtime = { version = "48", default-features = false, features = ["runtime", "std", "cranelift"] }
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses the actor.yml manifest, the maintained fork of serde_yaml.
serde_yaml_ng = "0.10"
anyhow = "1"
# HTTPS for URL imports and `edge build` vendoring.
ureq = { version = "3", features = ["brotli"] }
# Signs a publish with the token secret, on the ring and base64 ureq already brings.
ring = "0.17"
base64 = "0.22"
# Stable actor keys that survive removal, so the scheduler queues never dangle.
slab = "0.4"
# One thread serves every ingress connection, epoll or kqueue waking it for those with data.
mio = { version = "1", features = ["os-poll", "net"] }
# A unique temp file for the uninstall script, a predictable path invites symlink squatting.
tempfile = "3"
# SpiderMonkey, which runs the system calls `js/dist` carries, the one JavaScript the CLI ever evaluates.
mozjs = "0.26"
# The WebSocket client behind `net.connect`, on the rustls ureq already brings.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Drives the browser host for `edge run --web` over CDP, `fetch` downloads a known-good Chromium when the user agrees.
headless_chrome = { version = "1", features = ["fetch"] }

# SIGTERM and SIGINT close a live actor server so its actors finish what they hold.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[build-dependencies]
# Precompiles compiler.wasm for the build target.
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "all-arch", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# build.rs runs Cranelift over compiler.wasm, unoptimized it takes ten times longer.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
