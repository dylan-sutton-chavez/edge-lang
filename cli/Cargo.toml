# an empty table makes this crate its own workspace root, apart from the engine workspace
[workspace]

[package]
name = "interpreter-cli"
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/dylan-sutton-chavez/interpreter"
# its build embeds the js host made outside this crate
publish = false
description = "The interpreter CLI kit, a core that takes a runtime and the commands a composition wires, and the interpreter binary composed from it."

# the kit a composition builds a command line from
[lib]
name = "interpreter_cli"
path = "src/lib.rs"

# the reference composition wiring every command over the runtime a project declares
[[bin]]
name = "interpreter"
path = "src/main.rs"
required-features = ["all"]

# a second composition of two commands which lint-cli builds with their features alone
[[example]]
name = "runner"
required-features = ["wasm", "run", "test"]

# a third composition over lox with its own words that is also its test
[[test]]
name = "channels"
path = "tests/channels.rs"
harness = false
required-features = ["wasm", "files", "perms", "run"]

# the interpreter composition's run and test over lox built in with no wasm
[[test]]
name = "native"
path = "tests/native.rs"
harness = false
required-features = ["docs", "files", "net", "perms", "run", "test", "web"]

# runtimes as native libraries in a child process held to what they give on wasm
[[test]]
name = "library"
path = "tests/library.rs"
required-features = ["native", "run", "build", "actors"]

# the lines a native run executed which the coverage feature writes out
[[test]]
name = "coverage"
path = "tests/coverage.rs"
harness = false
required-features = ["coverage", "run"]

# the interpreter composition over the rig's wasm for plugin and net calls lox cannot write
[[test]]
name = "rig"
path = "tests/rig.rs"
harness = false
required-features = ["wasm", "docs", "files", "net", "perms", "run", "test"]

# each command sits behind its own feature and the interpreter binary wires them all
[features]
default = ["all", "wasm"]
all = ["actors", "actors-server", "build", "docs", "files", "native", "init", "net", "packages", "perms", "run", "serve", "test", "uninstall", "web"]
actors = ["wasm", "dep:serde_yaml_ng", "dep:slab"]
# the live server an actor pool becomes with its ingress control endpoint and durable log
actors-server = ["actors", "dep:mio", "dep:signal-hook"]
# a bundle or a binary or a dist, each carrying the pages and the browser host of a project
build = ["docs", "web"]
# the pages a package ships held to the docs convention and to the icons Lucide draws
docs = []
# the lines each native run executed written where INTERPRETER_COVERAGE names
coverage = ["interpreter/coverage"]
# reads of the local files a grant names under the package that asks
files = ["dep:flate2"]
init = []
# the net host module of examples/net that the kit exports with its transports
net = ["dep:flate2", "dep:tungstenite"]
packages = []
# the grants a manifest writes for each package it imports held through one shared logic
perms = []
run = []
serve = ["dep:tiny_http"]
test = []
uninstall = ["dep:tempfile"]
# the browser host a dist vendors and a headless run drives
web = ["dep:headless_chrome", "dep:tiny_http"]
# runtimes as wasm modules wasmtime runs and the plugins a project declares
wasm = ["dep:wasmtime"]
# runtimes as native libraries a child process loads for a project that declares one
native = ["wasm", "dep:libloading"]

[dependencies]
# the engine crate as a library, manifest parsing and sha256 pinning
interpreter = { path = ".." }
# hosts the runtime a composition hands the kit and Cranelift compiles the plugins a project declares
wasmtime = { version = "48", default-features = false, features = ["runtime", "std", "cranelift"], optional = true }
clap = { version = "4", features = ["derive"] }
# opens the native library of a runtime a project declares native
libloading = { version = "0.8", optional = true }
# the static dev server and the page server of a headless run
tiny_http = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# parses the actor.yml manifest, the maintained fork of serde_yaml
serde_yaml_ng = { version = "0.10", optional = true }
anyhow = "1"
# HTTPS for URL imports and `interpreter build` vendoring.
ureq = { version = "3", features = ["brotli"] }
# stable actor keys that survive removal, so the scheduler queues never dangle
slab = { version = "0.4", optional = true }
# one thread serves every ingress connection, epoll or kqueue waking it for those with data
mio = { version = "1", features = ["os-poll", "net"], optional = true }
# a unique temp file for the uninstall script, a predictable path invites symlink squatting
tempfile = { version = "3", optional = true }
# the WebSocket client behind `net.connect`, on the rustls ureq already brings
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
# inflates a gzip body `net.read` streams, the decoder ureq already brings for its own encodings
flate2 = { version = "1", optional = true }
# drives the browser host for `interpreter run --web` over CDP, `fetch` downloads a known-good Chromium when the user agrees
headless_chrome = { version = "1", features = ["fetch"], optional = true }

# SIGTERM and SIGINT close a live actor server so its actors finish what they hold.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false, features = ["iterator"], optional = true }

# the throwaway projects the tests write
[dev-dependencies]
tempfile = "3"
# the fixture servers the suites answer net and module fetches with
tiny_http = "0.12"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
flate2 = "1"
# the kernels and the plugin kit the docs examples name
interpreter = { path = "..", features = ["full", "plugin"] }
# the reference runtime the native test builds into its binary
interpreter-lox = { path = "../examples/lox" }
# the names of the rig whose wasm the rig test loads
rig = { path = "../tests/rig", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# build.rs runs Cranelift over interpreter.wasm which unoptimized takes ten times longer
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# a tool beside the engine reads files and the environment the sandbox rule keeps from it
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
