# A dispatcher fans five jobs into a lazily-grown actor pool under a high ceiling and max_actors cap.
runtime:
  max_actors: 100000

groups:
  dispatcher:
    replicas: 1
    code: |
      receive();
      var i = 0;
      while (i < 5) {
          send("actors", "job");
          i = i + 1;
      }
    seed:
      - go
  actors:
    replicas: 1000000
    code: |
      var job = receive();
      print "done";

expect:
  - "done"
  - "done"
  - "done"
  - "done"
  - "done"
