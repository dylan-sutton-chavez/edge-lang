# An eval group compiles each published message as its own program, print output proves execution.
runtime:
  listen: tcp://127.0.0.1:7789
  control: tcp://127.0.0.1:9789
  durable: tmp/actor/log

groups:
  runners:
    replicas: 4
    eval: true

publish:
  - 'runners print("two plus three is", 2 + 3)'
  - 'runners print("hello from a snippet")'
  # Building a list and a string exercises the allocator inside the sandboxed instance.
  - 'runners print("".join(text(i) for i in range(5)))'

expect:
  - "two plus three is 5"
  - "hello from a snippet"
  - "01234"

# A POST to /eval/<group> runs the body on the eval group and replies with what it printed.
post:
  - path: "/eval/runners"
    body: 'print("answered over http")'
    expect: "{\"ok\":true,\"stdout\":\"answered over http\\n\"}"
  # A snippet has no scheduler to send through, send() names what it lacks.
  - path: "/eval/runners"
    body: 'send("g", "x")'
    expect: "send needs an actor scheduler which this runtime lacks"
  # an eval run reads no remote module so it fails before any request
  - path: "/eval/runners"
    body: "use remote"
    expect: "module 'https://example.com/remote.mini' is not available to untrusted eval runs"
