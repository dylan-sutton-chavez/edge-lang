# A crashing message is retried up to the limit then dropped, /stats must report it dead.
runtime:
  listen: tcp://127.0.0.1:7787
  control: tcp://127.0.0.1:9787
  durable: tmp/actor/log

groups:
  crasher:
    replicas: 5
    retry: 2
    code: |
      while true:
          msg = receive()
          raise ValueError("boom")

publish:
  - "crasher poison"

expect: []

# One message, three attempts, then dropped, so the /stats body carries a dead count.
expect_status: "\"dead\":1"
