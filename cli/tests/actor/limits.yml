# A group memory ceiling below the sandbox profile reaches the interpreter, allocation past it raises MemoryError.
groups:
  capped:
    replicas: 1
    limits:
      memory: 1
    seed: ["go"]
    code: |
      receive()
      try {
          xs = [text(i) for i in range(50000)]
          print("unbounded")
      } catch MemoryError {
          print("capped")
      }

expect:
  - "capped"
