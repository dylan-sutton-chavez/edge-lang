# A single-shot group at its replicas ceiling passes queued messages on, the sink counts every one.
groups:
  dispatcher:
    replicas: 1
    code: |
      receive();
      var i = 0;
      while (i < 3000) {
          send("workers", text(i));
          i = i + 1;
      }
    seed:
      - go
  workers:
    replicas: 8
    code: |
      var m = receive();
      send("sink", m);
  sink:
    replicas: 1
    code: |
      var n = 0;
      while (true) {
          receive();
          n = n + 1;
          if (n == 3000) {
              print "all " + text(n);
          }
      }

expect:
  - "all 3000"
