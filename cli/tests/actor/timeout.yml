# An untrusted run that never yields is cut by the epoch deadline, the reply names the limit.
runtime:
  listen: tcp://127.0.0.1:7790
  control: tcp://127.0.0.1:9790
  durable: tmp/actor/log

groups:
  runners:
    eval: true
    limits:
      ops: 18446744073709551615

expect: []

# the op budget is the largest a group takes so only the clock can end the spin
post:
  - path: "/eval/runners"
    body: "while true:\n    pass"
    expect: "time limit"
