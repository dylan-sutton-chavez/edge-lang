# A live server echoes ingress messages and reports its state, exercising listen, wal and control.
runtime:
  listen: tcp://127.0.0.1:7788
  control: tcp://127.0.0.1:9788
  durable: tmp/actor/log

groups:
  echoer:
    replicas: 1
    code: |
      while true:
          msg = receive()
          print("got:", msg)

publish:
  - "echoer alpha"
  - "echoer beta"

expect:
  - "got: alpha"
  - "got: beta"
  - "got: gamma"

# Substring the /stats body must contain once the actor has settled.
expect_status: "\"actors\":1"

# A POST to /pub/<group> queues a message over HTTP, the echoer prints it like a tcp one.
post:
  - path: "/pub/echoer"
    body: "gamma"
    expect: "{\"ok\":true}"
