# A seed flows through a three-stage pipeline, plus per-group limits and a null-output producer.
groups:
  ingest:
    replicas: 1
    limits:
      memory: 64
      preempt: 500
    code: |
      var msg = receive();
      send("transform", msg + "-ingested");
    seed:
      - raw
  transform:
    replicas: 1
    code: |
      var msg = receive();
      send("sink", msg + "-transformed");
  sink:
    replicas: 1
    code: |
      var msg = receive();
      print "sink: " + msg;
  noisy:
    replicas: 1
    out: "null"
    code: |
      print "discarded";

expect:
  - "sink: raw-ingested-transformed"
