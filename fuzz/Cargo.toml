[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Standalone workspace so the parent workspace does not adopt this crate.
[workspace]

[dependencies]
afl = "0.18.2"

# lox reads every input through its own compiler
[dependencies.interpreter]
path = ".."
features = ["lox"]

# the test rig whose table spells every grammar piece Lox has no syntax for
[dependencies.rig]
path = "../tests/rig"

[[bin]]
name = "afl-pipeline"
path = "src/main.rs"

# cargo-afl already forces opt-level/asserts/overflow; this only adds line-tables (file:line backtraces) + asserts for a plain `cargo build --release` repro.
[profile.release]
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
