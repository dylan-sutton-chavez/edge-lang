[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Standalone workspace so the parent workspace does not adopt this crate.
[workspace]

[dependencies]
afl = "0.18.2"

[dependencies.edge]
path = ".."

# the reference runtime whose spelling the fuzzed sources are read in
[dependencies.mini]
path = "../examples/mini"

[[bin]]
name = "afl-pipeline"
path = "src/main.rs"

# cargo-afl already forces opt-level/asserts/overflow; this only adds line-tables (file:line backtraces) + asserts for a plain `cargo build --release` repro.
[profile.release]
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
