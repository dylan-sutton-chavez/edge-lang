[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# standalone workspace so the parent workspace does not adopt this crate
[workspace]

[dependencies]
afl = "0.18.2"

[dependencies.interpreter]
path = ".."

# lox reads every input through its own compiler
[dependencies.interpreter-lox]
path = "../examples/lox"

# the test rig whose table spells every grammar piece Lox has no syntax for
[dependencies.rig]
path = "../tests/rig"

[[bin]]
name = "afl-pipeline"
path = "src/main.rs"

# cargo-afl already forces opt-level asserts and overflow checks so this adds line tables for a plain `cargo build --release` repro.
[profile.release]
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
