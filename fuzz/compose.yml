name: edge-python-afl

services:
  fuzzer:
    build:
      context: ..
      dockerfile: fuzz/Dockerfile
    restart: unless-stopped
    stop_grace_period: 90s # longer than GRACE, so AFL gets to write its stats
    volumes:
      - findings:/app/fuzz/out

    environment:
      - JOBS
      - DURATION
      - GRACE
      - FRESH
      - TIMEOUT_MS
      - SEEDS
      - SCHEDULES
      - MUTATE
      - AFL_NO_AFFINITY=1 # containers hide cores; let scheduler place

volumes:
  findings:
