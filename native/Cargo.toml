[package]
name = "edge-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The VM as the one bitcode module `edge build` links a program's glue with."
publish = false

[lib]
crate-type = ["staticlib"]

# A native binary has std; a `.wasm` has none, so it imports only what the runtime itself calls, fd_write and proc_exit.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
edge-python = { path = "..", default-features = false, features = ["native", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
edge-python = { path = "..", default-features = false, features = ["native"] }
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }

[features]
# Collects and moves every object at each safepoint, which `edge build --gc-torture` builds for the tests.
gc-torture = ["edge-python/gc-torture"]
