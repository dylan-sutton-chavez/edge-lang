[package]
name = "interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build language runtimes in Rust: a single-pass parser to SSA bytecode, a register VM with an op budget, an exact memory meter, a GC and snapshots, with kernels, Lox and a plugin kit."
documentation = "https://docs.rs/interpreter"
readme = "README.md"
keywords = ["interpreter", "bytecode", "vm", "wasm", "language"]
categories = ["compilers", "wasm", "no-std"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE.md"]
autotests = false
autobins = false
autoexamples = false

# `make wasm` builds interpreter.wasm as a cdylib so dependents link a plain rlib
[lib]
name = "interpreter"
doctest = false

[[test]]
name = "engine"
path = "tests/engine/main.rs"

# its own binary since it runs without the metering allocator
[[test]]
name = "unmetered"
path = "tests/unmetered/main.rs"

[[test]]
name = "lib"
path = "tests/lib/main.rs"

# unsafe code lives in src/unsafe.rs alone which allows it for itself
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[package.metadata.docs.rs]
features = ["full", "plugin"]

[features]
default = ["std"]
std = []
# every module of `interpreter::lib`
full = ["bytes", "data", "date", "io", "iter", "map", "num", "reflect", "seq", "set", "spec", "text", "types"]
# `interpreter::lib` whose modules each pull in the modules whose helpers they call
lib = []
bytes = ["lib", "iter", "num"]
data = ["lib", "iter", "map"]
date = ["lib"]
io = ["lib"]
iter = ["lib"]
map = ["lib", "iter"]
num = ["lib", "iter"]
reflect = ["lib"]
seq = ["lib", "iter", "num"]
set = ["lib", "iter"]
spec = ["lib", "num"]
text = ["lib", "bytes", "iter", "num"]
types = ["lib"]
# `interpreter::plugin` for writing the WebAssembly plugins a program imports
plugin = ["dep:linked_list_allocator", "dep:lol_alloc"]
# records each executed instruction for `VM::ran` with method calls unfused to keep the compiler's ips
coverage = []
# the interpreter.wasm wrapper of exports and host imports plus its allocator and panic handler
runtime = []
# the grant logic exported for the hosts that read it through interpreter.wasm
perms = []
# the modules behind the stable API for the engine's own tests and tools
internals = []
# a padding static that shifts static data for make bench-layout
layout = []

[dependencies]
hashbrown = { workspace = true }
itoa = { workspace = true }
libm = { workspace = true }
linked_list_allocator = { version = "0.10", default-features = false, optional = true }

# wasm-only allocators as host builds use std's and treat interpreter.wasm as a library
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }
lol_alloc = { workspace = true, optional = true }

# test-only deps of the case runner that the release `interpreter.wasm` never pulls in
[dev-dependencies]
# the tests run every module and the plugin kit of this crate
interpreter = { path = ".", features = ["full", "plugin"] }
hashbrown = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# the tests run what lox cannot write through the test rig which links this crate back
rig = { path = "tests/rig" }
# what Lox can say the tests say in Lox through the example itself
interpreter-lox = { path = "examples/lox" }

[workspace]
members = ["plugin/example", "bench", "tests/rig", "examples/lox"]
# wasm-only `plugin/example` is out of default-members so build it with `-p slugify-mod`
default-members = [".", "tests/rig", "examples/lox"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/dylan-sutton-chavez/interpreter"

# one source of versions so a bump touches one line and the lockfile never splits
[workspace.dependencies]
hashbrown = { version = "0.17", default-features = false }
itoa = "1"
# without `arch` every target takes wasm32's software paths which Miri can interpret
libm = { version = "0.2", default-features = false }
lol_alloc = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# released CLIs embed this build of interpreter.wasm precompiled to native code so speed beats size
[profile.cli]
inherits = "release"
opt-level = 3

# the cli build of make bench-layout kept apart so neither build undoes the other
[profile.layout]
inherits = "cli"

# the VM corpora run the interpreter and unoptimized they take seventeen times longer
[profile.dev]
opt-level = 2
