[package]
name = "interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build language runtimes in Rust: a single-pass parser to SSA bytecode and a register VM with an op budget, an exact memory meter, a GC and snapshots."
documentation = "https://docs.rs/interpreter"
readme = "README.md"
keywords = ["interpreter", "bytecode", "vm", "wasm", "language"]
categories = ["compilers", "wasm", "no-std"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE.md"]
autotests = false
autobins = false
autoexamples = false

# `make wasm` builds interpreter.wasm as a cdylib so dependents link a plain rlib
[lib]
name = "interpreter"
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

# its own binary since it runs without the metering allocator
[[test]]
name = "unmetered"
path = "tests/unmetered.rs"

[features]
default = ["std"]
std = []
# records each executed instruction for `VM::ran` with method calls unfused to keep the compiler's ips
coverage = []
# the interpreter.wasm wrapper of exports and host imports plus its allocator and panic handler
runtime = []
# the grant logic exported for the hosts and the registry that read it through interpreter.wasm
perms = []
# the modules behind the stable API for the engine's own tests and tools
internals = []
# a padding static that shifts static data for make bench-layout
layout = []

[dependencies]
interpreter-abi = { workspace = true }
hashbrown = { workspace = true }
itoa = { workspace = true }
libm = { workspace = true }

# wasm-only global allocator as host builds use std's and treat interpreter.wasm as a library
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }

# test-only deps of the case runner that the release `interpreter.wasm` never pulls in
[dev-dependencies]
hashbrown = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# the tests run what lox cannot write through the test rig which links this crate back
rig = { path = "tests/rig" }
# what Lox can say the tests say in Lox through the example itself
interpreter-lox = { path = "examples/lox" }
# a test runtime renames these kernels to prove the engine binds by kernel
interpreter-lib = { path = "lib" }
# the indent table the syntax cases and the lexer and parser corpora are written in

[workspace]
members = ["abi", "plugin", "plugin/macros", "plugin/example", "skill", "bench", "lib", "tests/rig", "examples/lox"]
# wasm-only `plugin/example` is out of default-members so build it with `-p slugify-mod`
default-members = [".", "abi", "plugin", "plugin/macros", "skill", "lib", "tests/rig", "examples/lox"]
resolver = "2"

[workspace.package]
version = "0.9.7"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/dylan-sutton-chavez/interpreter"

# one source of versions so a bump touches one line and the lockfile never splits
[workspace.dependencies]
interpreter = { path = ".", version = "0.9.7", default-features = false }
interpreter-abi = { path = "abi", version = "0.9.7" }
interpreter-lib = { path = "lib", version = "0.9.7", default-features = false }
interpreter-lox = { path = "examples/lox", version = "0.9.7", default-features = false }
interpreter-plugin-macros = { path = "plugin/macros", version = "0.9.7" }
hashbrown = { version = "0.17", default-features = false }
itoa = "1"
# without `arch` every target takes wasm32's software paths which Miri can interpret
libm = { version = "0.2", default-features = false }
lol_alloc = "0.4"
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.3", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# released CLIs embed this build of interpreter.wasm precompiled to native code so speed beats size
[profile.cli]
inherits = "release"
opt-level = 3

# the cli build of make bench-layout kept apart so neither build undoes the other
[profile.layout]
inherits = "cli"

# the VM corpora run the interpreter and unoptimized they take seventeen times longer
[profile.dev]
opt-level = 2
