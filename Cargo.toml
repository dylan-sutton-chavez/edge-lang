[package]
name = "edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The engine of Edge Lang, for building language runtimes in Rust. A single-pass parser compiles source to SSA bytecode through the token table a runtime brings, and a register VM runs it with calls as jumps, NaN-boxed values, inline caches, an exact memory meter, mark-sweep GC and snapshots. One WebAssembly module runs in browsers, JavaScript runtimes and the CLI."
readme = "README.md"
autotests = false
autobins = false
autoexamples = false

# `make wasm` builds edge.wasm as a cdylib so dependents link a plain rlib
[lib]
name = "edge"
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

# its own binary since it runs without the metering allocator
[[test]]
name = "unmetered"
path = "tests/unmetered.rs"

[features]
default = ["std"]
std = []
# records each executed instruction for `VM::ran` with method calls unfused to keep the compiler's ips
coverage = []
# the edge.wasm wrapper of exports and host imports plus its allocator and panic handler
runtime = []
# the grant logic exported for the hosts and the registry that read it through edge.wasm
perms = []
# the modules behind the stable API for the engine's own tests and tools
internals = []
# a padding static that shifts static data for make bench-layout
layout = []

[dependencies]
abi = { workspace = true }
hashbrown = { workspace = true }
itoa = { workspace = true }
libm = { workspace = true }

# wasm-only global allocator as host builds use std's and treat edge.wasm as a library
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }

# test-only deps of the case runner that the release `edge.wasm` never pulls in
[dev-dependencies]
hashbrown = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# the tests run every program through the reference runtime which links this crate back
mini = { path = "examples/mini" }
# a test runtime renames these kernels to prove the engine binds by kernel
lib = { path = "lib" }
# the indent table the syntax cases and the lexer and parser corpora are written in
spell = { path = "tools/spell" }

[workspace]
members = ["abi", "plugin", "plugin/macros", "plugin/example", "skill", "bench", "lib", "examples/mini", "examples/tiny", "examples/uptime", "examples/data", "examples/native", "tools/spell"]
# wasm-only `plugin/example` is out of default-members so build it with `-p slugify-mod`
default-members = [".", "abi", "plugin", "plugin/macros", "skill", "lib", "examples/mini", "examples/tiny", "examples/uptime", "examples/data", "examples/native"]
resolver = "2"

[workspace.package]
version = "0.9.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dylan-sutton-chavez/edge-lang/"

# one source of versions so a bump touches one line and the lockfile never splits
[workspace.dependencies]
abi = { path = "abi" }
hashbrown = { version = "0.17", default-features = false }
itoa = "1"
# without `arch` every target takes wasm32's software paths which Miri can interpret
libm = { version = "0.2", default-features = false }
lol_alloc = "0.4"
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.3", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# released CLIs embed this build of edge.wasm precompiled to native code so speed beats size
[profile.cli]
inherits = "release"
opt-level = 3

# the cli build of make bench-layout kept apart so neither build undoes the other
[profile.layout]
inherits = "cli"

# the VM corpora run the interpreter and unoptimized they take seventeen times longer
[profile.dev]
opt-level = 2
