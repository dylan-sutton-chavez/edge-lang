[package]
name = "interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build language runtimes in Rust on a register VM with op budgets, exact memory metering, a GC and snapshots, plus kernels, a WebAssembly plugin kit and a CLI kit."
documentation = "https://docs.rs/interpreter"
readme = "README.md"
keywords = ["bytecode", "vm", "wasm", "language", "runtime"]
categories = ["compilers", "wasm", "no-std", "command-line-utilities"]
# besides src the cli features compile these files and the js host that make js writes
include = ["/src/**/*.rs", "/src/engine/cli/templates/*.html", "/build.rs", "/cli/setup/uninstall.sh", "/examples/net/net.rs", "/js/dist/**/*.js", "/README.md", "/LICENSE.md"]
autotests = false
autobins = false
autoexamples = false

# `make wasm` builds interpreter.wasm as a cdylib so dependents link a plain rlib and the docs pages run as doctests
[lib]
name = "interpreter"

# the reference composition wiring every command over the runtime a project declares
[[bin]]
name = "interpreter"
path = "src/main.rs"
required-features = ["cli"]
doc = false

[[test]]
name = "engine"
path = "tests/engine/main.rs"

# its own binary since it runs without the metering allocator
[[test]]
name = "unmetered"
path = "tests/unmetered/main.rs"

[[test]]
name = "lib"
path = "tests/lib/main.rs"

[[test]]
name = "cli"
path = "tests/cli/cli.rs"
required-features = ["cli"]

[[test]]
name = "run"
path = "tests/cli/run.rs"
required-features = ["cli"]

[[test]]
name = "actor"
path = "tests/cli/actor.rs"
required-features = ["cli"]

[[test]]
name = "consistency"
path = "tests/cli/consistency.rs"
required-features = ["cli"]

# a third composition over lox with its own words that is also its test
[[test]]
name = "channels"
path = "tests/cli/channels.rs"
harness = false
required-features = ["cli-wasm", "cli-files", "cli-perms", "cli-run"]

# the interpreter composition's run and test over lox built in with no wasm
[[test]]
name = "native"
path = "tests/cli/native.rs"
harness = false
required-features = ["cli-docs", "cli-files", "cli-net", "cli-perms", "cli-run", "cli-test", "cli-web"]

# runtimes as native libraries in a child process of the interpreter binary held to what they give on wasm
[[test]]
name = "library"
path = "tests/cli/library.rs"
required-features = ["cli"]

# the lines a native run executed which a cli build with coverage writes out
[[test]]
name = "coverage"
path = "tests/cli/coverage.rs"
harness = false
required-features = ["coverage", "cli-run"]

# the interpreter composition over the rig's wasm for plugin and net calls lox cannot write
[[test]]
name = "rig"
path = "tests/cli/rig.rs"
harness = false
required-features = ["cli-wasm", "cli-docs", "cli-files", "cli-net", "cli-perms", "cli-run", "cli-test"]

# a second composition of two commands which lint-cli builds with their features alone
[[example]]
name = "runner"
path = "examples/cli/runner.rs"
required-features = ["cli-wasm", "cli-run", "cli-test"]

# unsafe code lives in src/engine/unsafe.rs alone which allows it for itself
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
# pub means exported and a public signature shows only types with a path
unreachable_pub = "deny"
unnameable_types = "deny"
unexpected_cfgs = "deny"

# the readme the crate docs include links nothing that fails to resolve
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# an exported enum or struct is non_exhaustive or frozen until the next major
[lints.clippy]
exhaustive_enums = "deny"
exhaustive_structs = "deny"

# a minor release adds no exhaustive enum or struct since one could never grow again
[package.metadata.cargo-semver-checks.lints]
exhaustive_enum_added = { level = "deny", required-update = "major" }
exhaustive_struct_added = { level = "deny", required-update = "major" }

[package.metadata.docs.rs]
features = ["full", "plugin", "cli", "exports", "coverage"]

# shear follows no path attribute so it never reads the net module of examples/net that uses tungstenite
[package.metadata.cargo-shear]
ignored = ["tungstenite"]

[features]
default = ["std"]
std = []
# every module of `interpreter::lib`
full = ["bytes", "data", "date", "io", "iter", "map", "num", "seq", "set", "spec", "text", "types"]
# `interpreter::lib` whose modules each pull in the modules whose helpers they call
lib = []
bytes = ["lib", "iter", "num"]
data = ["lib", "iter", "map"]
date = ["lib"]
io = ["lib"]
iter = ["lib"]
map = ["lib", "iter"]
num = ["lib", "iter"]
seq = ["lib", "iter", "num"]
set = ["lib", "iter"]
spec = ["lib", "num"]
text = ["lib", "bytes", "iter", "num"]
# the type tests and the attribute kernels of `lib::types` and `lib::reflect`
types = ["lib"]
# `interpreter::plugin` for writing the WebAssembly plugins a program imports
plugin = ["dep:lol_alloc"]
# records each executed instruction for `VM::ran` with method calls unfused and a cli build writes the lines of each native run where INTERPRETER_COVERAGE names
coverage = []
# the interpreter.wasm wrapper of exports and host imports with the grant logic hosts read plus its allocator and panic handler
exports = []
# the modules behind the stable API for the engine's own tests and tools
unstable-internals = []
# a padding static that shifts static data for make bench-layout and no stable API
unstable-layout = []
# the interpreter binary and `interpreter::cli` with every command the binary wires
cli = ["std", "cli-kit", "cli-actors", "cli-build", "cli-docs", "cli-files", "cli-init", "cli-library", "cli-net", "cli-packages", "cli-perms", "cli-run", "cli-serve", "cli-test", "cli-uninstall", "cli-web"]
# the kit a composition builds a command line from with no command wired
cli-kit = ["std", "dep:anyhow", "dep:clap", "dep:serde", "dep:serde_json", "dep:ureq"]
# actor pools and the live server a pool becomes with its ingress control endpoint and durable log
cli-actors = ["cli-wasm", "dep:serde_yaml_ng", "dep:slab", "dep:mio", "dep:signal-hook"]
# a bundle or a binary or a dist, each carrying the pages and the browser host of a project
cli-build = ["cli-docs", "cli-web"]
# the pages a package ships held to the docs convention
cli-docs = ["cli-kit"]
# reads of the local files a grant names under the package that asks
cli-files = ["cli-kit", "dep:flate2"]
cli-init = ["cli-kit"]
# the net host module of examples/net that the kit exports with its transports
cli-net = ["cli-kit", "dep:flate2", "dep:tungstenite"]
cli-packages = ["cli-kit"]
# the grants a manifest writes for each package it imports held through one shared logic
cli-perms = ["cli-kit"]
cli-run = ["cli-kit"]
cli-serve = ["cli-kit", "dep:tiny_http"]
cli-test = ["cli-kit"]
cli-uninstall = ["cli-kit", "dep:tempfile"]
# the browser host a dist vendors and a headless run drives
cli-web = ["cli-kit", "dep:headless_chrome", "dep:tiny_http"]
# runtimes as wasm modules wasmtime runs and the plugins a project declares
cli-wasm = ["cli-kit", "dep:wasmtime"]
# runtimes as native libraries a child process loads for a project that declares one
cli-library = ["cli-wasm", "dep:libloading"]

[dependencies]
hashbrown = { workspace = true }
itoa = { workspace = true }
libm = { workspace = true }
# the cli features alone pull in what follows so an engine build compiles none of it
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# HTTPS for URL imports and `interpreter build` vendoring
ureq = { version = "3", features = ["brotli"], optional = true }
# hosts the runtime a composition hands the kit and Cranelift compiles the plugins a project declares
wasmtime = { version = "48", default-features = false, features = ["runtime", "std", "cranelift"], optional = true }
# opens the native library of a runtime a project declares native
libloading = { version = "0.8", optional = true }
# the static dev server and the page server of a headless run
tiny_http = { version = "0.12", optional = true }
# parses the actor.yml manifest, the maintained fork of serde_yaml
serde_yaml_ng = { workspace = true, optional = true }
# stable actor keys that survive removal so the scheduler queues never dangle
slab = { version = "0.4", optional = true }
# one thread serves every ingress connection, epoll or kqueue waking it for those with data
mio = { version = "1", features = ["os-poll", "net"], optional = true }
# a unique temp file for the uninstall script since a predictable path invites symlink squatting
tempfile = { version = "3", optional = true }
# the WebSocket client behind `net.connect` on the rustls ureq already brings
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
# inflates a gzip body `net.read` streams, the decoder ureq already brings for its own encodings
flate2 = { version = "1", optional = true }
# drives the browser host for `interpreter run --web` over CDP and `fetch` downloads a known-good Chromium when the user agrees
headless_chrome = { version = "1", features = ["fetch"], optional = true }

# SIGTERM and SIGINT close a live actor server so its actors finish what they hold
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false, features = ["iterator"], optional = true }

# wasm-only allocators as host builds use std's and treat interpreter.wasm as a library
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }
lol_alloc = { workspace = true, optional = true }

# test-only deps of the case runner that the release `interpreter.wasm` never pulls in
[dev-dependencies]
# the tests run every module and the plugin kit of this crate
interpreter = { path = ".", features = ["full", "plugin", "unstable-internals"] }
hashbrown = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# the tests run what lox cannot write through the test rig which links this crate back
rig = { path = "tests/rig" }
# what Lox can say the tests say in Lox through the example itself and the cli tests run on
interpreter-lox = { path = "examples/lox" }
# the throwaway projects the cli tests write
tempfile = "3"
# the fixture servers the cli suites answer net and module fetches with
tiny_http = "0.12"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
flate2 = "1"

[workspace]
members = ["plugin/example", "bench", "tests/rig", "examples/lox"]
# wasm-only `plugin/example` is out of default-members so build it with `-p slugify-mod`
default-members = [".", "tests/rig", "examples/lox"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/dylan-sutton-chavez/interpreter"

# one source of versions so a bump touches one line and the lockfile never splits
[workspace.dependencies]
hashbrown = { version = "0.17", default-features = false }
itoa = "1"
# without `arch` every target takes wasm32's software paths
libm = { version = "0.2", default-features = false }
lol_alloc = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the speed build of interpreter.wasm the tests of the CLI and the bench run so speed beats size
[profile.cli]
inherits = "release"
opt-level = 3

# a native runtime unwinds a panic so each export answers it as an error
[profile.native]
inherits = "release"
panic = "unwind"

# the cli build of make bench-layout kept apart so neither build undoes the other
[profile.layout]
inherits = "cli"

# the VM corpora run the interpreter and unoptimized they take seventeen times longer
[profile.dev]
opt-level = 2
