[package]
name = "edge-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-pass SSA compiler and tiered register VM for a sandboxed Python subset, with NaN-boxed values, inline caches, memoization, mark-sweep GC and snapshots. One WebAssembly module runs in browsers, JavaScript runtimes and the CLI."
readme = "README.md"
autotests = false
autobins = false

# `make wasm` builds compiler.wasm as a cdylib, so a crate depending on this one links a plain rlib.
[lib]
name = "compiler"
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

# Its own binary, since it runs without the metering allocator.
# The opcode handlers over the corpus, as a native build's glue drives them.
[[test]]
name = "native"
path = "tests/native.rs"
required-features = ["native"]

[[test]]
name = "unmetered"
path = "tests/unmetered.rs"

[features]
default = ["std"]
std = []
# Records each instruction a run executes for `VM::ran`, method calls left unfused so every ip is the compiler's own.
coverage = []
# The wrapper that makes compiler.wasm, its exports, host imports, allocator and panic handler.
runtime = []
# `call_pure` and the host of plain values it runs the builtins on, left out of the shipped compiler.wasm.
pure = []
# The modules behind the stable API, for the engine's own tests and tools that read them.
internals = []
# The VM as the bitcode `edge build` links its glue with, the `op_` handlers, frames and entry.
native = ["std"]
# A native build that collects and moves every object at each safepoint, for the tests.
gc-torture = ["native"]

[dependencies]
wasm-abi = { workspace = true }
hashbrown = { workspace = true }
itoa = { workspace = true }
libm = { workspace = true }

# WASM-only global allocator, host builds use std's and treat compiler.wasm as a library artifact.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }

# Test-only deps for the JSON-driven test runner. None of these are pulled into the release `compiler.wasm`.
[dev-dependencies]
hashbrown = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }

[workspace]
members = ["abi", "pdk", "pdk/macros", "pdk/example", "skill", "bench", "native"]
# `pdk/example` is wasm-only, in `members` for the lockfile but out of `default-members`, build it with `-p slugify-mod`.
default-members = [".", "abi", "pdk", "pdk/macros", "skill"]
resolver = "2"

[workspace.package]
version = "0.9.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dylan-sutton-chavez/edge-python/"

# One source for dependency versions, a bump touches one line and the lockfile never splits versions.
[workspace.dependencies]
wasm-abi = { path = "abi" }
hashbrown = { version = "0.17", default-features = false }
itoa = "1"
# Without `arch` every target takes the same software paths, the ones wasm32 takes, which Miri can interpret.
libm = { version = "0.2", default-features = false }
lol_alloc = "0.4"
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.3", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Released CLIs embed this build of compiler.wasm, precompiled to native code, so speed beats size.
[profile.cli]
inherits = "release"
opt-level = 3

# The VM corpora run the interpreter, unoptimized they take seventeen times longer.
[profile.dev]
opt-level = 2
