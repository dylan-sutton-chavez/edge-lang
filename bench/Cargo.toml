[package]
name = "bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Holds interpreter.wasm to its last run of the Lox bench programs, run it with make bench."
default-run = "bench"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "48", default-features = false, features = ["runtime", "std", "cranelift"] }
serde = { workspace = true }
serde_json = { workspace = true }

# a tool beside the engine reads files and the environment the sandbox rule keeps from it
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
