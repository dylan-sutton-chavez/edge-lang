[package]
name = "bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Holds compiler.wasm to its last run of tests/cases/vm.json, run it with make bench."

[dependencies]
wasmtime = { version = "48", default-features = false, features = ["runtime", "std", "cranelift"] }
# WASI for both sides of bench/llvm, each output stream apart.
wasmtime-wasi = { version = "48", default-features = false, features = ["p1"] }
serde = { workspace = true }
serde_json = { workspace = true }
