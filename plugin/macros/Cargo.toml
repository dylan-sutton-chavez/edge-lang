[package]
name = "interpreter-plugin-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros of interpreter-plugin, which re-exports them, so depend on that crate instead."
documentation = "https://docs.rs/interpreter-plugin-macros"
readme = "../../README.md"
keywords = ["interpreter", "plugin", "wasm", "macros"]
categories = ["wasm", "development-tools::procedural-macro-helpers"]
include = ["/src/**/*.rs"]

[lib]
proc-macro = true
test = false
doctest = false

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
