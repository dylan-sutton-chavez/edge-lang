- name: a url reads its hour through the net plugin when the host is granted
  grants: ['net:data.gharchive.org']
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: without the grant the run stops at from with Denied naming the host
  grants: []
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  error: 'from at line 1: Denied, ''main'' has no net:data.gharchive.org, edge.json grants it nothing'

- name: a grant of another host does not reach this one
  grants: ['net:example.com']
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  error: 'from at line 1: Denied, ''main'' has no net:data.gharchive.org, edge.json grants it net:example.com'

- name: a grant of a path reaches that path
  grants: ['net:data.gharchive.org/2026-10-01-15.json.gz']
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: a grant of another path is refused naming the path asked
  grants: ['net:data.gharchive.org/2025']
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  error: 'from at line 1: Denied, ''main'' has no net:data.gharchive.org/2026-10-01-15.json.gz, edge.json grants it net:data.gharchive.org/2025'

- name: a run with no permissions holds every host
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: a txt url reads a body of lines through the plugin
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/text/hello.txt
    lines:
  out:
    lines:
      - '{"line":"hello from net"}'

- name: a gz url inflates its body
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/gzip/hello.txt.gz
    lines:
  out:
    lines:
      - '{"line":"hello from gzip"}'

- name: a body of two gzip streams fails as the plugin fails it
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/gzip-twice/both.txt.gz
    lines:
  error: 'from at line 1: HostFailed, reading the response failed, junk found after the end of the gzip stream'

- name: a status other than 200 fails the source
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/missing/page.txt
    lines:
  error: 'from at line 1: HostFailed, http://127.0.0.1:1/missing/page.txt answered 404, not 200'

- name: a redirect fails the source as the plugin fails it
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/redirect/page.txt
    lines:
  error: 'from at line 1: HostFailed, net.request to http://127.0.0.1:1/redirect/page.txt was redirected, request the new address with its own net.request'

- name: a line longer than a chunk reads whole
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/big/digits.txt
    sizes:
      count: size = len(line)
  out:
    sizes:
      - '{"size":200000,"count":1}'

- name: a url the plugin refuses is bad data
  grants: ['net:127.0.0.1']
  flow: |
    from: http://user@127.0.0.1:1/text/hello.txt
    lines:
  error: 'from at line 1: BadData, ''http://user@127.0.0.1:1/text/hello.txt'' is not a plain url, net takes scheme://host/path with no user, backslash or space'

- name: a gzip body under no gz extension is no text
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/gzip/hello.txt
    lines:
  error: 'from at line 1: BadData, line 1 of http://127.0.0.1:1/gzip/hello.txt is no utf-8 text'

- name: a jsonl url reads lines of JSON with no inflating
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/hour/events.jsonl
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: a url's query and fragment follow its extension
  grants: ['net:127.0.0.1']
  flow: |
    from: http://127.0.0.1:1/hour/events.jsonl?page=1#top
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: a local path reads through the files module when nothing bounds it
  flow: |
    from: events.jsonl
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: the canonical flow reads its hour and writes its reports
  grants: ['net:data.gharchive.org']
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    where: not actor.login.endswith("[bot]")

    top_stars:
      where: type == "WatchEvent"
      count: repo.name
      top: 10

    busy_branches:
      where: type == "PushEvent"
      count: repo.name, branch = payload.ref.removeprefix("refs/heads/")
      keep: count > 1

    activity.csv:
      count: minute = created_at[11:16], type

    issues_opened:
      where: type == "IssuesEvent" and payload.action == "opened"
      count: repo.name

    time_to_close:
      where: type == "IssuesEvent" and payload.action == "closed"
      average: hours_between(payload.issue.created_at, payload.issue.closed_at)
      by: repo.name
  out:
    busy_branches:
      - '{"repo":{"name":"BuilderShock/repo-iarsfsno"},"branch":"main","count":2}'
