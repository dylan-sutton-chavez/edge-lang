- name: a flow parked on its source resumes from a snapshot as from its pause
  grants: ['net:data.gharchive.org']
  hops: true
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    total:
      count:
  out:
    total:
      - '{"count":431}'

- name: a report keeps its rows across snapshots
  grants: ['net:data.gharchive.org']
  hops: true
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    kinds:
      count: type
      sort: -count, type
  out:
    kinds:
      - '{"type":"PushEvent","count":130}'
      - '{"type":"WatchEvent","count":121}'
      - '{"type":"IssuesEvent","count":87}'
      - '{"type":"CreateEvent","count":42}'
      - '{"type":"IssueCommentEvent","count":20}'
      - '{"type":"PullRequestEvent","count":20}'
      - '{"type":"DeleteEvent","count":11}'

- name: every report keeps its state across snapshots
  grants: ['net:data.gharchive.org']
  hops: true
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    starred:
      where: type == "WatchEvent"
      count: repo.name
      keep: count > 2
    opened:
      where: type == "IssuesEvent" and payload.action == "opened"
      count:
    closed:
      where: type == "IssuesEvent" and payload.action == "closed"
      count:
  out:
    closed:
      - '{"count":15}'
    opened:
      - '{"count":26}'
    starred:
      - '{"repo":{"name":"shihabal3amri/DiPlay"},"count":3}'

