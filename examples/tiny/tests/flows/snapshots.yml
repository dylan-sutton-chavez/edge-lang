- name: a named key survives snapshots
  grants: ['net:data.gharchive.org']
  hops: true
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    kinds:
      where: type == "CreateEvent"
      count: kind = payload.ref_type.upper()
      sort: kind
  out:
    kinds:
      - '{"kind":"BRANCH","count":42}'

- name: a time held across a wait survives a restore
  grants: ['net:data.gharchive.org']
  hops: true
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    latest:
      where: type == "IssuesEvent" and payload.action == "closed"
      max: time(payload.issue.closed_at)
  out:
    latest:
      - '{"max":"2026-10-01T15:50:31Z"}'

- name: a duration held across a wait survives a restore
  grants: ['net:data.gharchive.org']
  hops: true
  flow: |
    from: https://data.gharchive.org/2026-10-01-15.json.gz
    longest:
      where: type == "IssuesEvent" and payload.action == "closed"
      max: time(payload.issue.closed_at) - time(payload.issue.created_at)
  out:
    longest:
      - '{"max":"5619740s"}'

- name: a source of host input never waits so it never hops
  input: slice
  hops: true
  flow: |
    from: input
    total:
      count:
  out:
    total:
      - '{"count":431}'
