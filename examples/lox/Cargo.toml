[package]
name = "interpreter-lox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lox from Crafting Interpreters as a runtime on interpreter, the one interpreter.wasm and the CLI are built from, held to the book's test suite."
# an example of the repo that interpreter.wasm the CLI the bench and the fuzzer build on
publish = false

[lib]
name = "interpreter_lox"
doctest = false

[[bin]]
name = "lox"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["interpreter/std"]
# builds interpreter.wasm with the engine's exports over these natives and the grant logic
web = ["interpreter/runtime", "interpreter/perms"]
# two natives that panic and abort which the crash tests of a native runtime call
crash = ["std"]

[dependencies]
# the engine and the kernels its few natives past the book come from
interpreter = { path = "../..", default-features = false, features = ["io", "seq"] }
