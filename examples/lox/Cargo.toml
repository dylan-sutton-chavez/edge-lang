[package]
name = "interpreter-lox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lox from Crafting Interpreters as a runtime on interpreter, with its own compiler over the lexer and builder, held to the book's test suite."
documentation = "https://docs.rs/interpreter-lox"
readme = "../../README.md"
keywords = ["interpreter", "lox", "crafting-interpreters", "wasm"]
categories = ["compilers", "wasm"]
include = ["/src/**/*.rs"]

[lib]
name = "interpreter_lox"
doctest = false

[[bin]]
name = "lox"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["interpreter/std"]
# builds interpreter.wasm with the engine's exports over these natives and the grant logic
web = ["interpreter/runtime", "interpreter/perms"]

[dependencies]
interpreter = { workspace = true }
# the kernels its few natives past the book come from
interpreter-lib = { workspace = true, features = ["io", "seq"] }
